bio: |
  邓一凌，浙江工业大学教授、博导，设计与建筑学院党委委员、城乡规划系副主任，国家注册城乡规划师。
  入选浙江省高校领军人才培养计划、浙江工业大学“十四五”高层次人才培育计划。

  兼任中国技术经济学会低碳智慧城市专委会委员、中国城市科学研究会韧性城市专委会委员、
  浙江省发改委妇儿工委儿童友好城市建设专家、浙江省国土空间规划学会专家库专家及交通与工程规划专委会委员。

  东南大学交通运输工程专业博士，多伦多大学、北京大学公派访问学者。主要从事交通行为、规划与政策研究。
  主持国家自然科学基金 2 项、浙江省哲学社会科学规划课题 2 项，参与国家级课题 2 项。
  第一或通讯作者发表国内外高水平期刊论文 40 余篇，出版专著 1 部，参编教材 5 部。

  第一完成人获浙江省哲学社会科学优秀成果奖青年奖、钱学森城市学金奖提名奖及 2 项国际竞赛一等奖。
  资政建言获浙江省和杭州市主要领导肯定性批示 4 项。
  2015—2017 年间任银川市贺兰县政府副县长（挂职），分管城乡规划与交通运输工作，支援东西部扶贫协作。

